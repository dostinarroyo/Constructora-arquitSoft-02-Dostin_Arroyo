  <text x="66" y="1173" class="small">* Agrupaciones para facilitar la lectura; validar los módulos con los requisitos.</text>

  <rect x="795" y="1030" width="760" height="155" rx="7" fill="#ffffff" stroke="#a3aab3" stroke-width="1.3"/>
  <text x="816" y="1057" class="card-title">Reglas de la arquitectura</text>
  <text x="816" y="1086" class="small">1. Presentación entrega solicitudes a Aplicación; no accede directamente a MySQL.</text>
  <text x="816" y="1112" class="small">2. Aplicación define los puertos; Infraestructura los implementa.</text>
  <text x="816" y="1138" class="small">3. Dominio contiene conceptos y reglas, sin depender de tecnologías.</text>
  <text x="816" y="1164" class="small">4. Áreas funcionales ilustrativas; ConstructoraSys no muestra servicios externos.</text>
