<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1220" viewBox="0 0 1650 1220" style="width: 100%; height: auto;" role="img" aria-labelledby="title description">
  <title id="title">Estilo arquitectónico de ConstructoraSys</title>
  <desc id="description">Monolito modular con cuatro capas horizontales de Clean Architecture y cinco áreas funcionales ilustrativas. El navegador y MySQL están fuera del límite de despliegue de la aplicación.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="implements-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="database-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #475569; }
      .boundary-title { font-size: 18px; font-weight: 700; }
      .area-title { font-size: 16px; font-weight: 700; }
      .layer-title { font-size: 15px; font-weight: 700; }
      .layer-copy { font-size: 13px; fill: #334155; }
      .card-title { font-size: 14px; font-weight: 700; }
      .card-copy { font-size: 13px; }
      .small { font-size: 13px; fill: #475569; }
      .edge-label { font-size: 12px; font-weight: 600; fill: #475569; }
      .request { fill: none; stroke: #334155; stroke-width: 2.3; marker-end: url(#arrow); }
      .implements { fill: none; stroke: #7c3aed; stroke-width: 2.3; stroke-dasharray: 8 6; marker-end: url(#implements-arrow); }
      .database-link { fill: none; stroke: #2563eb; stroke-width: 4; marker-end: url(#database-arrow); }
    </style>
  </defs>

