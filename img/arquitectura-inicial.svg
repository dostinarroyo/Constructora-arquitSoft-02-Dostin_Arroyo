<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title description">
  <title id="title">Arquitectura inicial de ConstructoraSys</title>
  <desc id="description">Diagrama de Clean Architecture con actores, presentación, aplicación, dominio e infraestructura con MySQL.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .layer-title { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
      .node-title { font-size: 21px; font-weight: 700; }
      .node-copy { font-size: 18px; }
      .edge-label { font-size: 17px; font-weight: 600; fill: #475569; }
      .edge { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .dependency { fill: none; stroke: #64748b; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#arrow-dashed); }
    </style>
  </defs>

  <rect width="1500" height="760" fill="#ffffff"/>

  <rect x="270" y="185" width="500" height="290" rx="18" fill="#f3f7ff" stroke="#2563a6" stroke-width="2"/>
  <text x="520" y="222" text-anchor="middle" class="layer-title" fill="#17365d">PRESENTACIÓN</text>

  <rect x="810" y="185" width="340" height="290" rx="18" fill="#f2faf5" stroke="#2d8a57" stroke-width="2"/>
  <text x="980" y="222" text-anchor="middle" class="layer-title" fill="#14532d">APLICACIÓN</text>

  <rect x="1190" y="245" width="360" height="150" rx="18" fill="#fff9ed" stroke="#c27a12" stroke-width="2"/>
  <text x="1370" y="282" text-anchor="middle" class="layer-title" fill="#713f12">DOMINIO</text>

  <rect x="810" y="525" width="740" height="180" rx="18" fill="#f8f4ff" stroke="#7646b8" stroke-width="2"/>
  <text x="1180" y="562" text-anchor="middle" class="layer-title" fill="#4c1d95">INFRAESTRUCTURA</text>

  <rect x="40" y="290" width="185" height="100" rx="12" fill="#f4f4f5" stroke="#52525b" stroke-width="2"/>
  <text x="132.5" y="328" text-anchor="middle" class="node-title">
    <tspan x="132.5">Actores internos</tspan>
    <tspan x="132.5" dy="27">autorizados</tspan>
  </text>

  <rect x="290" y="280" width="210" height="120" rx="10" fill="#e7f0ff" stroke="#2563a6" stroke-width="2"/>
  <text x="395" y="314" text-anchor="middle" class="node-title">Interfaz web</text>
  <text x="395" y="344" text-anchor="middle" class="node-copy">
    <tspan x="395">Formularios · Consultas</tspan>
    <tspan x="395" dy="25">Panel · Reportes</tspan>
  </text>

  <rect x="530" y="280" width="210" height="120" rx="10" fill="#ffffff" stroke="#2563a6" stroke-width="2"/>
  <text x="635" y="324" text-anchor="middle" class="node-title">Controladores</text>
  <text x="635" y="354" text-anchor="middle" class="node-copy">
    <tspan x="635">Puntos de entrada</tspan>
  </text>

  <rect x="840" y="265" width="280" height="90" rx="10" fill="#e9f7ef" stroke="#2d8a57" stroke-width="2"/>
  <text x="980" y="302" text-anchor="middle" class="node-title">Casos de uso</text>
  <text x="980" y="332" text-anchor="middle" class="node-copy">Coordinar operaciones</text>

  <rect x="840" y="380" width="280" height="75" rx="10" fill="#e9f7ef" stroke="#2d8a57" stroke-width="2"/>
  <text x="980" y="411" text-anchor="middle" class="node-title">Puertos requeridos</text>
  <text x="980" y="437" text-anchor="middle" class="node-copy">Contratos de repositorio</text>

  <rect x="1220" y="300" width="300" height="85" rx="10" fill="#fff3df" stroke="#c27a12" stroke-width="2"/>
  <text x="1370" y="335" text-anchor="middle" class="node-title">Entidades y reglas</text>
  <text x="1370" y="365" text-anchor="middle" class="node-copy">de negocio</text>

  <rect x="845" y="585" width="315" height="85" rx="10" fill="#f2eaff" stroke="#7646b8" stroke-width="2"/>
  <text x="1002.5" y="620" text-anchor="middle" class="node-title">Adaptadores de persistencia</text>
  <text x="1002.5" y="649" text-anchor="middle" class="node-copy">Spring Security</text>

  <rect x="1200" y="585" width="320" height="85" rx="10" fill="#f2eaff" stroke="#7646b8" stroke-width="2"/>
  <text x="1360" y="620" text-anchor="middle" class="node-title">MySQL</text>
  <text x="1360" y="649" text-anchor="middle" class="node-copy">Base de datos central</text>

  <path class="edge" d="M 225 340 H 295"/>
  <path class="edge" d="M 500 340 H 530"/>
  <path class="edge" d="M 740 340 H 840"/>
  <path class="edge" d="M 1120 310 H 1220"/>
  <path class="edge" d="M 1160 628 H 1200"/>

  <path class="dependency" d="M 980 355 V 380"/>
  <text x="995" y="375" class="edge-label">usa</text>
  <path class="dependency" d="M 1002 585 V 475 H 980 V 455"/>
  <text x="1018" y="500" class="edge-label">implementa</text>
</svg>
