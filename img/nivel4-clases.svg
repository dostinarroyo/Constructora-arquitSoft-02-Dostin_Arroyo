<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240" role="img" aria-labelledby="title description">
  <title id="title">Diagrama de código del módulo Materiales y almacén</title>
  <desc id="description">Diagrama UML del caso de uso Registrar salida de material organizado en Presentación, Aplicación, Dominio e Infraestructura. El adaptador MySQL implementa el puerto de persistencia declarado en Aplicación.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11 Z" fill="#43556B"/>
    </marker>
    <marker id="openArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#43556B" stroke-width="1.5"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .title { fill: #172B4D; font-size: 30px; font-weight: 700; }
      .subtitle { fill: #526579; font-size: 17px; }
      .version { fill: #758397; font-size: 14px; }
      .lane { stroke-width: 1.5; stroke-dasharray: 7 5; }
      .lane-title { font-size: 15px; font-weight: 700; text-anchor: middle; }
      .module-boundary { fill: none; stroke: #365F9D; stroke-width: 2; }
      .module-label { fill: #365F9D; }
      .module-label-text { fill: #FFFFFF; font-size: 14px; font-weight: 700; }
      .class-box { fill: #FFFFFF; stroke: #61758C; stroke-width: 1.5; }
      .class-head { fill: #F7F9FC; }
      .class-name { fill: #23384F; font-size: 16px; font-weight: 700; text-anchor: middle; }
      .stereotype { fill: #63748A; font-size: 12px; text-anchor: middle; }
      .attribute { fill: #34495E; font-size: 13px; }
      .operation { fill: #263D55; font-size: 13px; }
      .note { fill: #FFF9E5; stroke: #D0AD49; stroke-width: 1.3; }
      .note-title { fill: #715A17; font-size: 13px; font-weight: 700; }
      .note-copy { fill: #5D512C; font-size: 12px; }
      .association { fill: none; stroke: #43556B; stroke-width: 1.8; marker-end: url(#arrow); }
      .dependency { fill: none; stroke: #43556B; stroke-width: 1.8; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .implementation { fill: none; stroke: #43556B; stroke-width: 1.8; stroke-dasharray: 6 4; marker-end: url(#openArrow); }
      .relation-label { fill: #536477; font-size: 12px; }
      .panel { fill: #FFFFFF; stroke: #B8C2CC; stroke-width: 1.4; }
      .panel-title { fill: #26384A; font-size: 15px; font-weight: 700; }
      .panel-copy { fill: #405164; font-size: 12px; }
      .db { fill: #E5F0FF; stroke: #438FD3; stroke-width: 1.8; }
    </style>
  </defs>

  <rect width="1800" height="1240" fill="#FFFFFF"/>
  <text class="title" x="48" y="48">Diagrama de código · Materiales y almacén</text>
  <text class="subtitle" x="48" y="77">C4 · Nivel 4 · Caso de uso: registrar salida de material asociada a un proyecto</text>
  <text class="version" x="1752" y="48" text-anchor="end">UML · v1.1</text>
  <line x1="48" y1="98" x2="1752" y2="98" stroke="#E2E8EF" stroke-width="1"/>

  <rect x="48" y="125" width="370" height="815" fill="#F7FAFF" stroke="#D5E4F6" class="lane"/>
  <rect x="418" y="125" width="405" height="815" fill="#F5FBF7" stroke="#D3EBDD" class="lane"/>
  <rect x="823" y="125" width="410" height="815" fill="#FFFBF4" stroke="#F0DFC3" class="lane"/>
  <rect x="1233" y="125" width="519" height="815" fill="#FBF8FF" stroke="#E3D8F3" class="lane"/>
  <text class="lane-title" x="233" y="151" fill="#2563A6">PRESENTACIÓN</text>
  <text class="lane-title" x="620" y="151" fill="#2D8A57">APLICACIÓN</text>
  <text class="lane-title" x="1028" y="151" fill="#B07017">DOMINIO</text>
  <text class="lane-title" x="1492" y="151" fill="#7646B8">INFRAESTRUCTURA</text>

  <rect class="module-boundary" x="58" y="174" width="1684" height="735"/>
  <rect class="module-label" x="58" y="174" width="310" height="30"/>
  <text class="module-label-text" x="72" y="194">MÓDULO · MATERIALES Y ALMACÉN</text>

  <g>
    <rect class="class-box" x="82" y="347" width="305" height="176"/>
    <rect class="class-head" x="82" y="347" width="305" height="47"/>
    <line x1="82" y1="394" x2="387" y2="394" stroke="#61758C"/>
    <line x1="82" y1="449" x2="387" y2="449" stroke="#61758C"/>
    <text class="class-name" x="234" y="368">SalidaMaterialController</text>
    <text class="stereotype" x="234" y="386">«REST Controller · propuesta»</text>
    <text class="attribute" x="96" y="416">- registrarSalida</text>
    <text class="attribute" x="96" y="436">- presentarResultado</text>
    <text class="operation" x="96" y="472">+ solicitarSalida(SolicitudSalida)</text>
    <text class="operation" x="96" y="494">  : ResultadoSalida</text>
  </g>

  <g>
    <rect class="class-box" x="444" y="270" width="220" height="188"/>
    <rect class="class-head" x="444" y="270" width="220" height="48"/>
    <line x1="444" y1="318" x2="664" y2="318" stroke="#61758C"/>
    <line x1="444" y1="358" x2="664" y2="358" stroke="#61758C"/>
    <text class="class-name" x="554" y="291">RegistrarSalidaMaterial</text>
    <text class="stereotype" x="554" y="310">«Use case»</text>
    <text class="attribute" x="456" y="341">- repositorio</text>
    <text class="operation" x="456" y="382">+ ejecutar(solicitud)</text>
    <text class="operation" x="456" y="403">  : ResultadoSalida</text>
    <text class="operation" x="456" y="430">+ valida y coordina el flujo</text>
  </g>

  <g>
    <rect class="class-box" x="682" y="270" width="125" height="173"/>
    <rect class="class-head" x="682" y="270" width="125" height="48"/>
    <line x1="682" y1="318" x2="807" y2="318" stroke="#61758C"/>
    <text class="class-name" x="744" y="290" style="font-size:14px">SolicitudSalida</text>
    <text class="stereotype" x="744" y="309">«DTO entrada»</text>
    <text class="attribute" x="692" y="342">+ materialId</text>
    <text class="attribute" x="692" y="364">+ proyectoId</text>
    <text class="attribute" x="692" y="386">+ cantidad</text>
    <text class="operation" x="692" y="420">Long · BigDecimal</text>
  </g>

  <g>
    <rect class="class-box" x="682" y="474" width="125" height="190"/>
    <rect class="class-head" x="682" y="474" width="125" height="48"/>
    <line x1="682" y1="522" x2="807" y2="522" stroke="#61758C"/>
    <text class="class-name" x="744" y="493" style="font-size:13px">ResultadoSalida</text>
    <text class="stereotype" x="744" y="513">«DTO salida»</text>
    <text class="attribute" x="692" y="546">+ materialId</text>
    <text class="attribute" x="692" y="568">+ proyectoId</text>
    <text class="attribute" x="692" y="590">+ cantidad</text>
    <text class="attribute" x="692" y="612">+ stockRestante</text>
    <text class="operation" x="692" y="642">BigDecimal</text>
  </g>

  <g>
    <rect class="class-box" x="444" y="697" width="363" height="169"/>
    <rect class="class-head" x="444" y="697" width="363" height="53"/>
    <line x1="444" y1="750" x2="807" y2="750" stroke="#61758C"/>
    <text class="class-name" x="625" y="719">RepositorioAlmacen</text>
    <text class="stereotype" x="625" y="740">«interface · puerto de salida»</text>
    <text class="operation" x="461" y="777">+ buscarMaterial(id: Long)</text>
    <text class="operation" x="461" y="799">  : Optional&lt;Material&gt;</text>
    <text class="operation" x="461" y="827">+ registrarSalida(material, movimiento)</text>
    <text class="operation" x="461" y="849">  : void</text>
  </g>

  <g>
    <rect class="class-box" x="851" y="278" width="352" height="202"/>
    <rect class="class-head" x="851" y="278" width="352" height="52"/>
    <line x1="851" y1="330" x2="1203" y2="330" stroke="#61758C"/>
    <line x1="851" y1="397" x2="1203" y2="397" stroke="#61758C"/>
    <text class="class-name" x="1027" y="300">Material</text>
    <text class="stereotype" x="1027" y="321">«entity»</text>
    <text class="attribute" x="868" y="354">- id: Long</text>
    <text class="attribute" x="868" y="375">- nombre: String</text>
    <text class="attribute" x="868" y="393">- stockActual: BigDecimal</text>
    <text class="operation" x="868" y="423">+ descontar(cantidad): void</text>
    <text class="operation" x="868" y="450">  Rechaza cantidad no positiva</text>
    <text class="operation" x="868" y="469">  o stock insuficiente</text>
  </g>

  <g>
    <rect class="class-box" x="851" y="552" width="352" height="184"/>
    <rect class="class-head" x="851" y="552" width="352" height="52"/>
    <line x1="851" y1="604" x2="1203" y2="604" stroke="#61758C"/>
    <line x1="851" y1="685" x2="1203" y2="685" stroke="#61758C"/>
    <text class="class-name" x="1027" y="574">MovimientoAlmacen</text>
    <text class="stereotype" x="1027" y="595">«entity»</text>
    <text class="attribute" x="868" y="628">- materialId: Long</text>
    <text class="attribute" x="868" y="649">- proyectoId: Long</text>
    <text class="attribute" x="868" y="670">- cantidad: BigDecimal</text>
    <text class="operation" x="868" y="711">+ tipo: TipoMovimiento</text>
    <text class="operation" x="868" y="730">  ENTRADA | SALIDA</text>
  </g>

  <g>
    <rect class="class-box" x="900" y="773" width="255" height="91"/>
    <rect class="class-head" x="900" y="773" width="255" height="48"/>
    <line x1="900" y1="821" x2="1155" y2="821" stroke="#61758C"/>
    <text class="class-name" x="1027" y="793">TipoMovimiento</text>
    <text class="stereotype" x="1027" y="813">«enumeration»</text>
    <text class="operation" x="1027" y="846" text-anchor="middle">ENTRADA · SALIDA</text>
  </g>

  <g>
    <rect class="class-box" x="1280" y="367" width="423" height="226"/>
    <rect class="class-head" x="1280" y="367" width="423" height="54"/>
    <line x1="1280" y1="421" x2="1703" y2="421" stroke="#61758C"/>
    <line x1="1280" y1="470" x2="1703" y2="470" stroke="#61758C"/>
    <text class="class-name" x="1491" y="389">AdaptadorAlmacenMySql</text>
    <text class="stereotype" x="1491" y="410">«repository adapter»</text>
    <text class="attribute" x="1297" y="449">- repositorio JPA / transacciones</text>
    <text class="operation" x="1297" y="496">+ buscarMaterial(id): Optional&lt;Material&gt;</text>
    <text class="operation" x="1297" y="521">+ registrarSalida(material, movimiento)</text>
    <text class="operation" x="1297" y="546">  Actualiza stock y guarda movimiento</text>
    <text class="operation" x="1297" y="571">  dentro de una transacción</text>
  </g>

  <g>
    <path class="db" d="M1340 987 C1340 966 1488 950 1636 966 C1680 971 1703 980 1703 987 V1078 C1703 1097 1622 1112 1521 1112 C1420 1112 1340 1097 1340 1078 Z"/>
    <ellipse class="db" cx="1521" cy="987" rx="181" ry="23"/>
    <text class="class-name" x="1521" y="1024">MySQL</text>
    <text class="stereotype" x="1521" y="1047">«database · Nivel 2»</text>
    <text class="operation" x="1521" y="1073" text-anchor="middle">Materiales · Movimientos</text>
  </g>

  <path class="association" d="M387 435 H444"/>
  <rect x="385" y="405" width="66" height="20" fill="#FFFFFF"/>
  <text class="relation-label" x="418" y="419" text-anchor="middle">solicita</text>

  <path class="dependency" d="M664 305 H682"/>
  <text class="relation-label" x="668" y="294">usa</text>
  <path class="dependency" d="M554 458 V697"/>
  <rect x="559" y="568" width="80" height="20" fill="#F5FBF7"/>
  <text class="relation-label" x="566" y="583">consulta / guarda</text>

  <path class="association" d="M664 434 V458 H851"/>
  <rect x="707" y="438" width="108" height="19" fill="#F5FBF7"/>
  <text class="relation-label" x="761" y="452" text-anchor="middle">aplica reglas</text>

  <path class="association" d="M1027 480 V552"/>
  <text class="relation-label" x="1038" y="522">genera</text>
  <path class="association" d="M1027 736 V773"/>
  <text class="relation-label" x="1038" y="760">clasifica</text>

  <path class="implementation" d="M1280 548 H1245 V884 H820 V848 H807"/>
  <rect x="1030" y="861" width="167" height="20" fill="#FFFBF4"/>
  <text class="relation-label" x="1114" y="875" text-anchor="middle">implementa el puerto</text>

  <path class="association" d="M1491 593 V953"/>
  <rect x="1500" y="760" width="190" height="24" fill="#FFFFFF"/>
  <text class="relation-label" x="1595" y="777" text-anchor="middle">transacción SQL prevista</text>

  <rect class="note" x="73" y="588" width="315" height="155" rx="3"/>
  <text class="note-title" x="90" y="613">Vínculo con el proyecto</text>
  <text class="note-copy" x="90" y="638">
    <tspan x="90">La salida conserva proyectoId en el</tspan>
    <tspan x="90" dy="19">movimiento para la trazabilidad.</tspan>
    <tspan x="90" dy="19">Es una referencia por identificador;</tspan>
    <tspan x="90" dy="19">no implica acceso directo a tablas</tspan>
    <tspan x="90" dy="19">del módulo Proyectos.</tspan>
  </text>

  <rect class="panel" x="48" y="1140" width="1704" height="64" rx="4"/>
  <text class="panel-title" x="68" y="1165">Regla de dependencias</text>
  <text class="panel-copy" x="248" y="1165">Presentación → Aplicación → Dominio; Infraestructura implementa los puertos definidos en Aplicación.</text>
  <text class="panel-copy" x="68" y="1188">El diagrama es una propuesta de diseño, no código implementado. El controlador REST, MySQL y los detalles transaccionales deben confirmarse durante la implementación.</text>
</svg>
