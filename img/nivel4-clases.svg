<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240" role="img" aria-labelledby="title description">
  <title id="title">Diagrama de código del módulo Materiales y almacén</title>
  <desc id="description">Diagrama UML simplificado y ordenado por capas. Presentación solicita el caso de uso en Aplicación, que aplica reglas del Dominio y usa el puerto de persistencia implementado por Infraestructura.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11 Z" fill="#43556B"/>
    </marker>
    <marker id="openArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#43556B" stroke-width="1.5"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .title { fill: #172B4D; font-size: 30px; font-weight: 700; }
      .subtitle { fill: #526579; font-size: 17px; }
      .version { fill: #758397; font-size: 14px; }
      .lane { stroke-width: 1.5; stroke-dasharray: 7 5; }
      .lane-title { font-size: 15px; font-weight: 700; text-anchor: middle; }
      .module-boundary { fill: none; stroke: #365F9D; stroke-width: 2; }
      .module-label { fill: #365F9D; }
      .module-label-text { fill: #FFFFFF; font-size: 14px; font-weight: 700; }
      .class-box { fill: #FFFFFF; stroke: #61758C; stroke-width: 1.5; }
      .class-head { fill: #F7F9FC; }
      .class-name { fill: #23384F; font-size: 16px; font-weight: 700; text-anchor: middle; }
      .stereotype { fill: #63748A; font-size: 12px; text-anchor: middle; }
      .attribute { fill: #34495E; font-size: 13px; }
      .operation { fill: #263D55; font-size: 13px; }
      .note { fill: #FFF9E5; stroke: #D0AD49; stroke-width: 1.3; }
      .note-title { fill: #715A17; font-size: 13px; font-weight: 700; }
      .note-copy { fill: #5D512C; font-size: 12px; }
      .association { fill: none; stroke: #43556B; stroke-width: 1.8; marker-end: url(#arrow); }
      .dependency { fill: none; stroke: #43556B; stroke-width: 1.8; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .implementation { fill: none; stroke: #43556B; stroke-width: 1.8; stroke-dasharray: 6 4; marker-end: url(#openArrow); }
      .relation-label { fill: #536477; font-size: 12px; }
      .panel { fill: #FFFFFF; stroke: #B8C2CC; stroke-width: 1.4; }
      .panel-title { fill: #26384A; font-size: 15px; font-weight: 700; }
      .panel-copy { fill: #405164; font-size: 12px; }
      .db { fill: #E5F0FF; stroke: #438FD3; stroke-width: 1.8; }
    </style>
  </defs>

  <rect width="1800" height="1240" fill="#FFFFFF"/>
  <text class="title" x="48" y="48">Diagrama de código · Materiales y almacén</text>
  <text class="subtitle" x="48" y="77">C4 · Nivel 4 · Registrar salida de material asociada a un proyecto</text>
  <text class="version" x="1752" y="48" text-anchor="end">UML · v1.1</text>
  <line x1="48" y1="98" x2="1752" y2="98" stroke="#E2E8EF" stroke-width="1"/>

  <rect x="48" y="125" width="370" height="925" fill="#F7FAFF" stroke="#D5E4F6" class="lane"/>
  <rect x="418" y="125" width="432" height="925" fill="#F5FBF7" stroke="#D3EBDD" class="lane"/>
  <rect x="850" y="125" width="405" height="925" fill="#FFFBF4" stroke="#F0DFC3" class="lane"/>
  <rect x="1255" y="125" width="497" height="925" fill="#FBF8FF" stroke="#E3D8F3" class="lane"/>
  <text class="lane-title" x="233" y="151" fill="#2563A6">PRESENTACIÓN</text>
  <text class="lane-title" x="634" y="151" fill="#2D8A57">APLICACIÓN</text>
  <text class="lane-title" x="1052" y="151" fill="#B07017">DOMINIO</text>
  <text class="lane-title" x="1503" y="151" fill="#7646B8">INFRAESTRUCTURA</text>

  <rect class="module-boundary" x="58" y="174" width="1684" height="864"/>
  <rect class="module-label" x="58" y="174" width="310" height="30"/>
  <text class="module-label-text" x="72" y="194">MÓDULO · MATERIALES Y ALMACÉN</text>

  <g>
    <rect class="class-box" x="82" y="420" width="295" height="180"/>
    <rect class="class-head" x="82" y="420" width="295" height="50"/>
    <line x1="82" y1="470" x2="377" y2="470" stroke="#61758C"/>
    <line x1="82" y1="510" x2="377" y2="510" stroke="#61758C"/>
    <text class="class-name" x="229" y="442">SalidaMaterialController</text>
    <text class="stereotype" x="229" y="461">«REST Controller · propuesta»</text>
    <text class="attribute" x="96" y="493">- registrarSalida</text>
    <text class="operation" x="96" y="537">+ solicitarSalida(SolicitudSalida)</text>
    <text class="operation" x="96" y="560">  : ResultadoSalida</text>
    <text class="operation" x="96" y="583">+ presentarResultado(resultado)</text>
  </g>

  <g>
    <rect class="class-box" x="458" y="400" width="350" height="195"/>
    <rect class="class-head" x="458" y="400" width="350" height="52"/>
    <line x1="458" y1="452" x2="808" y2="452" stroke="#61758C"/>
    <line x1="458" y1="493" x2="808" y2="493" stroke="#61758C"/>
    <text class="class-name" x="633" y="423">RegistrarSalidaMaterial</text>
    <text class="stereotype" x="633" y="443">«caso de uso»</text>
    <text class="attribute" x="475" y="478">- repositorio: RepositorioAlmacen</text>
    <text class="operation" x="475" y="519">+ ejecutar(solicitud): ResultadoSalida</text>
    <text class="operation" x="475" y="546">Valida y coordina el registro</text>
    <text class="operation" x="475" y="571">Sin depender de MySQL ni HTTP</text>
  </g>

  <g>
    <rect class="class-box" x="445" y="235" width="185" height="112"/>
    <rect class="class-head" x="445" y="235" width="185" height="49"/>
    <line x1="445" y1="284" x2="630" y2="284" stroke="#61758C"/>
    <text class="class-name" x="537" y="256" style="font-size:14px">SolicitudSalida</text>
    <text class="stereotype" x="537" y="276">«DTO de entrada»</text>
    <text class="attribute" x="458" y="307">+ materialId: Long</text>
    <text class="attribute" x="458" y="327">+ proyectoId: Long</text>
    <text class="attribute" x="458" y="343">+ cantidad: BigDecimal</text>
  </g>

  <g>
    <rect class="class-box" x="646" y="235" width="185" height="112"/>
    <rect class="class-head" x="646" y="235" width="185" height="49"/>
    <line x1="646" y1="284" x2="831" y2="284" stroke="#61758C"/>
    <text class="class-name" x="738" y="256" style="font-size:14px">ResultadoSalida</text>
    <text class="stereotype" x="738" y="276">«DTO de salida»</text>
    <text class="attribute" x="659" y="307">+ materialId: Long</text>
    <text class="attribute" x="659" y="327">+ proyectoId: Long</text>
    <text class="attribute" x="659" y="343">+ stockRestante: BigDecimal</text>
  </g>

  <g>
    <rect class="class-box" x="458" y="770" width="373" height="155"/>
    <rect class="class-head" x="458" y="770" width="373" height="53"/>
    <line x1="458" y1="823" x2="831" y2="823" stroke="#61758C"/>
    <text class="class-name" x="644" y="792">RepositorioAlmacen</text>
    <text class="stereotype" x="644" y="813">«puerto de salida · interfaz»</text>
    <text class="operation" x="475" y="850">+ buscarMaterial(id): Optional&lt;Material&gt;</text>
    <text class="operation" x="475" y="876">+ registrarSalida(material, movimiento)</text>
    <text class="operation" x="475" y="902">Definido en Aplicación</text>
  </g>

  <g>
    <rect class="class-box" x="885" y="385" width="340" height="185"/>
    <rect class="class-head" x="885" y="385" width="340" height="50"/>
    <line x1="885" y1="435" x2="1225" y2="435" stroke="#61758C"/>
    <line x1="885" y1="495" x2="1225" y2="495" stroke="#61758C"/>
    <text class="class-name" x="1055" y="407">Material</text>
    <text class="stereotype" x="1055" y="427">«entidad»</text>
    <text class="attribute" x="902" y="460">- id · nombre · stockActual</text>
    <text class="operation" x="902" y="522">+ descontar(cantidad)</text>
    <text class="operation" x="902" y="547">Rechaza cantidad no válida o stock insuficiente</text>
  </g>

  <g>
    <rect class="class-box" x="885" y="660" width="340" height="150"/>
    <rect class="class-head" x="885" y="660" width="340" height="50"/>
    <line x1="885" y1="710" x2="1225" y2="710" stroke="#61758C"/>
    <text class="class-name" x="1055" y="682">MovimientoAlmacen</text>
    <text class="stereotype" x="1055" y="702">«entidad»</text>
    <text class="attribute" x="902" y="738">- materialId · proyectoId</text>
    <text class="attribute" x="902" y="760">- cantidad · tipo: TipoMovimiento</text>
    <text class="operation" x="902" y="790">Representa la salida del material</text>
  </g>

  <g>
    <rect class="class-box" x="930" y="855" width="250" height="90"/>
    <rect class="class-head" x="930" y="855" width="250" height="47"/>
    <line x1="930" y1="902" x2="1180" y2="902" stroke="#61758C"/>
    <text class="class-name" x="1055" y="875" style="font-size:14px">TipoMovimiento</text>
    <text class="stereotype" x="1055" y="895">«enumeración»</text>
    <text class="operation" x="1055" y="928" text-anchor="middle">ENTRADA · SALIDA</text>
  </g>

  <g>
    <rect class="class-box" x="1290" y="600" width="415" height="210"/>
    <rect class="class-head" x="1290" y="600" width="415" height="52"/>
    <line x1="1290" y1="652" x2="1705" y2="652" stroke="#61758C"/>
    <line x1="1290" y1="700" x2="1705" y2="700" stroke="#61758C"/>
    <text class="class-name" x="1497" y="623">AdaptadorAlmacenMySql</text>
    <text class="stereotype" x="1497" y="643">«adaptador de persistencia»</text>
    <text class="attribute" x="1307" y="680">- usa persistencia relacional</text>
    <text class="operation" x="1307" y="728">+ buscarMaterial(id)</text>
    <text class="operation" x="1307" y="752">+ registrarSalida(material, movimiento)</text>
    <text class="operation" x="1307" y="776">Guarda movimiento y stock en una transacción</text>
    <text class="operation" x="1307" y="798">Implementa el puerto de Aplicación</text>
  </g>

  <g>
    <path class="db" d="M1340 935 C1340 918 1485 905 1625 919 C1670 923 1690 929 1690 935 V1000 C1690 1017 1612 1030 1515 1030 C1418 1030 1340 1017 1340 1000 Z"/>
    <ellipse class="db" cx="1515" cy="935" rx="175" ry="22"/>
    <text class="class-name" x="1515" y="965">MySQL</text>
    <text class="stereotype" x="1515" y="986">«base de datos · Nivel 2»</text>
    <text class="operation" x="1515" y="1010" text-anchor="middle">Materiales · Movimientos</text>
  </g>

  <path class="association" d="M377 505 H458"/>
  <rect x="383" y="476" width="67" height="21" fill="#FFFFFF"/>
  <text class="relation-label" x="416" y="491" text-anchor="middle">solicita</text>

  <path class="dependency" d="M537 347 V400"/>
  <path class="dependency" d="M738 400 V347"/>
  <path class="association" d="M808 455 H885"/>
  <rect x="817" y="427" width="61" height="21" fill="#FFFFFF"/>
  <text class="relation-label" x="847" y="442" text-anchor="middle">valida</text>

  <path class="association" d="M808 560 V625 H885 V730"/>
  <rect x="817" y="605" width="63" height="21" fill="#FFFFFF"/>
  <text class="relation-label" x="848" y="620" text-anchor="middle">registra</text>

  <path class="dependency" d="M633 595 V770"/>
  <rect x="641" y="672" width="100" height="21" fill="#F5FBF7"/>
  <text class="relation-label" x="691" y="687" text-anchor="middle">usa el contrato</text>

  <path class="association" d="M1055 570 V660"/>
  <rect x="1063" y="608" width="65" height="21" fill="#FFFBF4"/>
  <text class="relation-label" x="1095" y="623" text-anchor="middle">genera</text>
  <path class="association" d="M1055 810 V855"/>

  <path class="implementation" d="M1290 785 H1260 V960 H832 V925"/>
  <rect x="1035" y="934" width="174" height="21" fill="#FFFBF4"/>
  <text class="relation-label" x="1122" y="949" text-anchor="middle">implementa el puerto</text>

  <path class="association" d="M1497 810 V915"/>
  <rect x="1506" y="850" width="174" height="21" fill="#FBF8FF"/>
  <text class="relation-label" x="1593" y="865" text-anchor="middle">transacción SQL prevista</text>

  <rect class="note" x="75" y="690" width="300" height="166" rx="3"/>
  <text class="note-title" x="93" y="716">¿Cómo se relaciona con el proyecto?</text>
  <text class="note-copy" x="93" y="742">
    <tspan x="93">El movimiento guarda proyectoId para</tspan>
    <tspan x="93" dy="20">mantener la trazabilidad de la salida.</tspan>
    <tspan x="93" dy="20">Es una referencia por identificador:</tspan>
    <tspan x="93" dy="20">no accede directamente a las tablas</tspan>
    <tspan x="93" dy="20">del módulo Proyectos.</tspan>
  </text>

  <rect class="panel" x="48" y="1065" width="1704" height="120" rx="4"/>
  <text class="panel-title" x="70" y="1093">Cómo leer las flechas</text>
  <line x1="270" y1="1088" x2="325" y2="1088" class="association"/>
  <text class="panel-copy" x="338" y="1093">Llamada o colaboración</text>
  <line x1="575" y1="1088" x2="630" y2="1088" class="implementation"/>
  <text class="panel-copy" x="645" y="1093">El adaptador implementa el puerto</text>
  <text class="panel-copy" x="70" y="1124">Flujo principal: Controller → caso de uso → reglas del dominio → puerto de persistencia → adaptador → MySQL.</text>
  <text class="panel-copy" x="70" y="1152">Cada columna es una capa. La API REST, MySQL y las clases son propuestas de diseño; no representan código ya implementado.</text>
</svg>
