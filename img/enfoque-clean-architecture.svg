<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1030" viewBox="0 0 1800 1030" style="width: 100%; height: auto;" role="img" aria-labelledby="title description">
  <title id="title">Enfoque arquitectónico de ConstructoraSys</title>
  <desc id="description">Diagrama Clean Architecture con presentación, aplicación, dominio, infraestructura y base de datos MySQL. Las flechas muestran el flujo de solicitudes, la dependencia del caso de uso y la implementación y uso de persistencia.</desc>
  <defs>
    <marker id="runtime-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#243247"/>
    </marker>
    <marker id="dependency-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#188044"/>
    </marker>
    <marker id="implementation-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7138bd"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #475569; }
      .boundary-title { font-size: 18px; font-weight: 700; }
      .zone-title { font-size: 17px; font-weight: 700; }
      .card-title { font-size: 15px; font-weight: 700; }
      .copy { font-size: 14px; }
      .small { font-size: 13px; fill: #475569; }
      .label { font-size: 13px; font-weight: 700; fill: #334155; }
      .runtime { fill: none; stroke: #243247; stroke-width: 2.6; marker-end: url(#runtime-arrow); }
      .dependency { fill: none; stroke: #188044; stroke-width: 2.6; stroke-dasharray: 9 6; marker-end: url(#dependency-arrow); }
      .implementation { fill: none; stroke: #7138bd; stroke-width: 2.6; stroke-dasharray: 9 6; marker-end: url(#implementation-arrow); }
    </style>
  </defs>

  <rect width="1800" height="1030" fill="#ffffff"/>
  <text x="45" y="48" class="title">Enfoque arquitectónico | ConstructoraSys</text>
  <text x="45" y="76" class="subtitle">Monolito modular · Clean Architecture</text>

  <rect x="70" y="112" width="1425" height="725" rx="10" fill="#ffffff" stroke="#424b57" stroke-width="2.4" stroke-dasharray="12 8"/>
  <text x="96" y="143" class="boundary-title">«aplicación» ConstructoraSys · Java · Spring Boot</text>

  <rect x="97" y="165" width="1370" height="570" rx="16" fill="#f7f8fa" stroke="#929aa5" stroke-width="1.7"/>
  <text x="782" y="191" text-anchor="middle" class="zone-title">CAPAS DE CONSTRUCTORASYS</text>

  <rect x="122" y="215" width="270" height="515" rx="10" fill="#e5f0ff" stroke="#3481d1" stroke-width="1.8"/>
  <text x="257" y="246" text-anchor="middle" class="zone-title">PRESENTACIÓN</text>
  <text x="257" y="269" text-anchor="middle" class="small">Interfaz y entrada web</text>
  <rect x="145" y="290" width="224" height="100" rx="7" fill="#ffffff" stroke="#3481d1" stroke-width="1.5"/>
  <text x="257" y="324" text-anchor="middle" class="card-title">Interfaz web</text>
  <text x="257" y="350" text-anchor="middle" class="copy">HTML · CSS · JavaScript</text>
  <text x="257" y="369" text-anchor="middle" class="small">Bootstrap</text>
  <rect x="145" y="425" width="224" height="110" rx="7" fill="#ffffff" stroke="#3481d1" stroke-width="1.5"/>
  <text x="257" y="453" text-anchor="middle" class="card-title">Adaptador de entrada</text>
  <text x="257" y="474" text-anchor="middle" class="copy">Controladores web</text>
  <text x="257" y="497" text-anchor="middle" class="copy">Reciben solicitudes</text>
  <text x="257" y="520" text-anchor="middle" class="copy">y validan su formato</text>
  <text x="257" y="627" text-anchor="middle" class="small">Devuelven resultados</text>
  <text x="257" y="648" text-anchor="middle" class="small">sin acceder a MySQL</text>

  <rect x="432" y="215" width="610" height="290" rx="12" fill="#e9f6ec" stroke="#39a052" stroke-width="1.8"/>
  <text x="737" y="246" text-anchor="middle" class="zone-title">APLICACIÓN · CASOS DE USO</text>
  <text x="737" y="269" text-anchor="middle" class="small">Coordina operaciones y solicita persistencia mediante puertos</text>

  <rect x="454" y="288" width="270" height="46" rx="6" fill="#ffffff" stroke="#39a052" stroke-width="1.4"/>
  <text x="589" y="309" text-anchor="middle" class="card-title">Gestionar proyectos</text>
  <text x="589" y="328" text-anchor="middle" class="copy">y actividades</text>
  <rect x="744" y="288" width="276" height="46" rx="6" fill="#ffffff" stroke="#39a052" stroke-width="1.4"/>
  <text x="882" y="309" text-anchor="middle" class="card-title">Registrar movimientos</text>
  <text x="882" y="328" text-anchor="middle" class="copy">de materiales</text>
  <rect x="454" y="341" width="270" height="46" rx="6" fill="#ffffff" stroke="#39a052" stroke-width="1.4"/>
  <text x="589" y="362" text-anchor="middle" class="card-title">Asignar personal y</text>
  <text x="589" y="381" text-anchor="middle" class="copy">maquinaria a proyectos</text>
  <rect x="744" y="341" width="276" height="46" rx="6" fill="#ffffff" stroke="#39a052" stroke-width="1.4"/>
  <text x="882" y="362" text-anchor="middle" class="card-title">Gestionar presupuesto</text>
  <text x="882" y="381" text-anchor="middle" class="copy">y gastos · reglas por definir</text>
  <rect x="454" y="394" width="566" height="36" rx="6" fill="#ffffff" stroke="#39a052" stroke-width="1.4"/>
  <text x="737" y="418" text-anchor="middle" class="copy">Consultar reportes y gestionar usuarios</text>
  <rect x="454" y="437" width="566" height="54" rx="6" fill="#ffffff" stroke="#39a052" stroke-width="1.4"/>
  <text x="737" y="459" text-anchor="middle" class="card-title">Puertos de persistencia</text>
  <text x="737" y="480" text-anchor="middle" class="small">Repositorios y consultas requeridos por los casos de uso</text>

  <rect x="432" y="535" width="610" height="195" rx="12" fill="#fff2d1" stroke="#d39a11" stroke-width="1.8"/>
  <text x="737" y="564" text-anchor="middle" class="zone-title">DOMINIO · NÚCLEO DEL NEGOCIO</text>
  <text x="737" y="586" text-anchor="middle" class="small">Entidades y reglas de negocio independientes de tecnologías</text>
  <rect x="454" y="602" width="566" height="96" rx="6" fill="#ffffff" stroke="#d39a11" stroke-width="1.4"/>
  <text x="737" y="628" text-anchor="middle" class="card-title">Entidades y reglas</text>
  <text x="737" y="651" text-anchor="middle" class="small">Proyecto · Actividad · Material · Trabajador · Equipo</text>
  <text x="737" y="673" text-anchor="middle" class="small">Gasto · VersionPresupuesto · Usuario · Rol</text>

  <rect x="1082" y="215" width="355" height="515" rx="10" fill="#f0e9fa" stroke="#7b4bbc" stroke-width="1.8"/>
  <text x="1259.5" y="246" text-anchor="middle" class="zone-title">INFRAESTRUCTURA</text>
  <text x="1259.5" y="269" text-anchor="middle" class="small">Adaptadores y mecanismos técnicos</text>
  <rect x="1110" y="290" width="299" height="80" rx="7" fill="#ffffff" stroke="#7b4bbc" stroke-width="1.5"/>
  <text x="1259.5" y="319" text-anchor="middle" class="card-title">Seguridad · Spring Security</text>
  <text x="1259.5" y="342" text-anchor="middle" class="copy">Autenticación y mecanismo técnico</text>
  <text x="1259.5" y="361" text-anchor="middle" class="small">Permisos por rol en casos protegidos</text>
  <rect x="1110" y="432" width="299" height="64" rx="7" fill="#ffffff" stroke="#7b4bbc" stroke-width="1.5"/>
  <text x="1259.5" y="458" text-anchor="middle" class="card-title">Adaptador de salida · Persistencia</text>
  <text x="1259.5" y="482" text-anchor="middle" class="copy">Implementa puertos · MySQL</text>
  <rect x="1110" y="535" width="299" height="80" rx="7" fill="#ffffff" stroke="#7b4bbc" stroke-width="1.5"/>
  <text x="1259.5" y="564" text-anchor="middle" class="card-title">Integración con Spring Boot</text>
  <text x="1259.5" y="587" text-anchor="middle" class="copy">Framework de la aplicación</text>

  <rect x="122" y="753" width="1285" height="60" rx="7" fill="#ffffff" stroke="#59616d" stroke-width="1.5"/>
  <text x="764.5" y="779" text-anchor="middle" class="card-title">Raíz de composición · configuración Spring Boot</text>
  <text x="764.5" y="801" text-anchor="middle" class="small">Conecta cada puerto con su adaptador concreto.</text>

  <rect x="8" y="347" width="55" height="74" rx="4" fill="#ffffff" stroke="#424b57" stroke-width="1.8"/>
  <text x="35.5" y="378" text-anchor="middle" class="small">Usuario</text>
  <text x="35.5" y="398" text-anchor="middle" class="small">interno</text>
  <path class="runtime" d="M 63 384 H 145"/>

  <path class="runtime" d="M 257 378 V 425"/>
  <path class="runtime" d="M 369 480 H 432"/>
  <text x="400" y="470" text-anchor="middle" class="label">invoca</text>
  <path class="dependency" d="M 737 505 V 535"/>
  <path class="implementation" d="M 1110 464 H 1020"/>
  <text x="1065" y="449" text-anchor="middle" class="label">implementa</text>
  <path class="runtime" d="M 1409 464 H 1547"/>
  <text x="1478" y="449" text-anchor="middle" class="label">SQL</text>

  <rect x="1547" y="417" width="235" height="176" rx="10" fill="#e8eef5" stroke="#59616d" stroke-width="1.8"/>
  <text x="1664.5" y="445" text-anchor="middle" class="small">«base de datos»</text>
  <ellipse cx="1664.5" cy="483" rx="57" ry="17" fill="#ffffff" stroke="#59616d" stroke-width="1.8"/>
  <path d="M 1607.5 483 V 538 C 1607.5 548 1633 556 1664.5 556 C 1696 556 1721.5 548 1721.5 538 V 483" fill="#dbeafe" stroke="#59616d" stroke-width="1.8"/>
  <path d="M 1607.5 510 C 1607.5 520 1633 528 1664.5 528 C 1696 528 1721.5 520 1721.5 510" fill="none" stroke="#59616d" stroke-width="1.4"/>
  <text x="1664.5" y="494" text-anchor="middle" class="card-title">MySQL</text>
  <text x="1664.5" y="577" text-anchor="middle" class="small">Base de datos central</text>

  <rect x="45" y="885" width="740" height="112" rx="7" fill="#ffffff" stroke="#a3aab3" stroke-width="1.3"/>
  <text x="66" y="911" class="card-title">Leyenda</text>
  <path d="M 68 938 H 120" stroke="#243247" stroke-width="2.6" marker-end="url(#runtime-arrow)"/>
  <text x="134" y="943" class="small">Llamada en tiempo de ejecución</text>
  <path d="M 390 938 H 442" stroke="#188044" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#dependency-arrow)"/>
  <text x="456" y="943" class="small">Dependencia del caso de uso</text>
  <path d="M 68 970 H 120" stroke="#7138bd" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#implementation-arrow)"/>
  <text x="134" y="975" class="small">El adaptador implementa el puerto</text>

  <rect x="805" y="885" width="977" height="112" rx="7" fill="#ffffff" stroke="#a3aab3" stroke-width="1.3"/>
  <text x="827" y="911" class="card-title">Reglas de dependencia</text>
  <text x="827" y="941" class="small">1. El Dominio no depende de Presentación, frameworks ni persistencia.</text>
  <text x="827" y="970" class="small">2. Aplicación define los puertos; Infraestructura los implementa.</text>
  <text x="1330" y="941" class="small">3. La configuración conecta las implementaciones.</text>
  <text x="1330" y="970" class="small">4. Cambiar tecnología no cambia las reglas del negocio.</text>
</svg>
